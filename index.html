<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>1095 Jazz Guitar</title>
  
  <meta property="og:type" content="website">
  <meta property="og:title" content="1095 Jazz Guitar - 3년 완주 재즈기타 루틴">
  <meta property="og:description" content="매일 3시간, 12키와 스케일·보이스리딩·코드멜로디 자동 배정 데일리 연습 엔진">
  <meta property="og:url" content="https://jazzography.github.io/jazz-guitar/">
  <meta name="twitter:card" content="summary">
  
  <meta name="apple-mobile-web-app-title" content="1095 Jazz Guitar">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
      touch-action: manipulation;
    }
    body { background: #0c0e12; color: #f1f5f9; padding-bottom: 120px; font-size: 14.5px; line-height: 1.5; }
    
    /* 최상단 컴팩트 라이브 알림 바 */
    .mini-live-bar {
      background: #181111; border-bottom: 1px solid #381a1a; padding: 7px 14px;
      display: flex; justify-content: space-between; align-items: center; font-size: 11.5px;
    }
    .mini-live-title { color: #fca5a5; display: flex; align-items: center; gap: 6px; font-weight: 700; }
    .mini-live-title span { display: inline-block; width: 7px; height: 7px; background: #ef4444; border-radius: 50%; }
    .mini-live-link { color: #f87171; text-decoration: none; font-weight: 800; }

    .container { max-width: 480px; margin: 0 auto; padding: 14px; }

    /* 날짜 탐색 헤더 */
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .day-display { display: flex; align-items: baseline; gap: 6px; }
    .day-display h2 { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
    .day-display span { font-size: 12px; color: #64748b; font-weight: 700; }
    .nav-actions { display: flex; gap: 4px; }
    .nav-btn {
      background: #181b22; border: 1px solid #282d37; color: #cbd5e1;
      padding: 6px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .arrow-btn { font-size: 13px; padding: 6px 12px; }

    /* 오늘의 핵심 요약 카드 */
    .today-summary-card {
      background: linear-gradient(135deg, #181d28 0%, #12151c 100%);
      border: 1px solid #2c3444; border-radius: 12px; padding: 14px; margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .summary-left div:first-child { font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
    .summary-key { font-size: 22px; font-weight: 900; color: #fbbf24; }
    .summary-right { text-align: right; }
    .summary-rhythm-badge {
      display: inline-block; background: #232014; border: 1px solid #78350f;
      color: #fde047; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 20px;
    }

    /* 4단계 아코디언 카드 */
    .routine-step-card {
      background: #14171f; border: 1px solid #242935; border-radius: 10px;
      margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s;
    }
    .routine-step-card.active { border-color: #3b82f6; }
    
    .step-header {
      padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; user-select: none;
    }
    .step-title-wrap { display: flex; align-items: center; gap: 8px; }
    .step-num {
      width: 20px; height: 20px; border-radius: 5px; background: #1e2638; color: #38bdf8;
      font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }
    .step-name { font-size: 14px; font-weight: 800; color: #f1f5f9; }
    .step-time { font-size: 11.5px; color: #64748b; font-weight: 700; margin-right: 6px; }
    .toggle-icon { font-size: 11px; color: #64748b; transition: transform 0.2s; }
    .routine-step-card.active .toggle-icon { transform: rotate(180deg); color: #38bdf8; }

    /* 펼쳐지는 세부 내용 */
    .step-body {
      display: none; padding: 0 14px 14px 14px; border-top: 1px solid #1a1e28;
      background: #11131a;
    }
    .routine-step-card.active .step-body { display: block; }
    
    .task-item {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 0;
      border-bottom: 1px dashed #1e2330; font-size: 13.5px; color: #e2e8f0;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item input { width: 17px; height: 17px; margin-top: 2px; accent-color: #f59e0b; cursor: pointer; }

    .video-hint-link {
      display: inline-block; margin-top: 10px; font-size: 12px; color: #93c5fd;
      text-decoration: none; font-weight: 700;
    }

    /* 개인 연습 & 완주 버튼 */
    .personal-box {
      background: #12141a; border: 1px solid #202430; border-radius: 10px;
      padding: 12px 14px; margin: 12px 0;
    }
    .personal-head { font-size: 12.5px; font-weight: 800; color: #c084fc; margin-bottom: 6px; }
    .memo-input {
      width: 100%; background: #0a0b0e; border: 1px solid #232733; color: #fff;
      border-radius: 6px; padding: 8px 10px; font-size: 13px; line-height: 1.4;
    }

    .done-btn {
      width: 100%; background: #22c55e; color: #000; border: none; font-weight: 900;
      font-size: 15px; padding: 14px; border-radius: 9px; cursor: pointer;
    }
    .done-btn.completed { background: #166534; color: #86efac; }

    /* 커피 후원 미니바 */
    .mini-donate {
      display: flex; justify-content: center; gap: 12px; margin-top: 16px;
      font-size: 12px; color: #64748b;
    }
    .mini-donate a { color: #94a3b8; text-decoration: none; font-weight: 700; }
    .mini-donate a:hover { color: #facc15; }

    /* 하단 메트로놈 닥 */
    .metro-dock {
      position: fixed; bottom: 0; left: 0; right: 0; background: #10131a;
      border-top: 1px solid #242935; padding: 10px 16px; z-index: 99;
      display: flex; justify-content: center;
    }
    .metro-inner { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between; }
    .bpm-ctrl { display: flex; align-items: center; gap: 6px; }
    .bpm-ctrl button {
      background: #1a1e28; border: 1px solid #2b3140; color: #fff;
      width: 34px; height: 34px; border-radius: 6px; font-weight: 900; cursor: pointer;
    }
    .bpm-val { font-size: 18px; font-weight: 900; min-width: 55px; text-align: center; }
    .play-btn {
      background: #f59e0b; color: #000; border: none; font-weight: 900;
      padding: 0 18px; height: 36px; border-radius: 6px; font-size: 13.5px; cursor: pointer;
    }
    .play-btn.on { background: #ef4444; color: #fff; }

    /* 모달 */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #14171f; border: 1px solid #334155; border-radius: 12px; padding: 20px; max-width: 420px; width: 100%; }
  </style>
</head>
<body>

  <!-- 미니멀 1줄 라이브 배너 -->
  <div class="mini-live-bar">
    <div class="mini-live-title"><span></span> [월 9pm] 프로반 라이브</div>
    <a href="https://www.youtube.com/channel/UCI8PtsibK2wGkrvaKUdW0kg/join" target="_blank" rel="noopener" class="mini-live-link">
      참여하기 →
    </a>
  </div>

  <div class="container">
    
    <!-- 상단 날짜 및 빠른 이동 네비게이션 -->
    <div class="nav-bar">
      <div class="day-display">
        <h2 id="dayTitle">DAY 1</h2>
        <span>/ 1095</span>
      </div>
      <div class="nav-actions">
        <button onclick="openIndexModal()" class="nav-btn" id="indexBtnTxt">🔍 주제</button>
        <button onclick="toggleLang()" class="nav-btn" id="langToggleBtn">EN</button>
        <button onclick="moveDay(-1)" class="nav-btn arrow-btn">◀</button>
        <button onclick="moveDay(1)" class="nav-btn arrow-btn">▶</button>
      </div>
    </div>

    <!-- 오늘의 요약 카드 (Key & 리듬 한눈에 보기) -->
    <div class="today-summary-card">
      <div class="summary-left">
        <div id="txtTodayKeyLabel">TODAY'S KEY</div>
        <div class="summary-key" id="summaryKeyText">C Major</div>
      </div>
      <div class="summary-right">
        <div class="summary-rhythm-badge" id="summaryRhythmText">4분음표</div>
      </div>
    </div>

    <!-- 4단계 연습 섹션 (아코디언 UI) -->
    <div id="routineAccordion"></div>

    <!-- 개인 연습 메모 -->
    <div class="personal-box">
      <div class="personal-head" id="personalTitle">★ 개인 연습 과제 & 레슨 노트</div>
      <textarea id="memoBox" class="memo-input" rows="2" placeholder="교재 페이지, 과제 곡, 레슨 메모 입력" oninput="saveMemo()"></textarea>
    </div>

    <!-- 완주 체크 버튼 -->
    <button id="completeBtn" class="done-btn" onclick="toggleComplete()">오늘 3시간 완주 체크 완료</button>

    <!-- 하단 미니 후원 링크 -->
    <div class="mini-donate">
      <span>☕ 준킴 응원하기:</span>
      <a href="https://qr.kakaopay.com/FMnnbr8OU" target="_blank" rel="noopener">카카오페이</a>
      <span>·</span>
      <a href="https://ko-fi.com/junkimmusic" target="_blank" rel="noopener">Ko-fi (Global)</a>
    </div>

  </div>

  <!-- 메트로놈 바 -->
  <div class="metro-dock">
    <div class="metro-inner">
      <div class="bpm-ctrl">
        <button onclick="stepBpm(-5)">-5</button>
        <button onclick="stepBpm(-1)">-</button>
        <div class="bpm-val"><span id="bpmTxt">85</span><div style="font-size:9px; color:#64748b;">BPM</div></div>
        <button onclick="stepBpm(1)">+</button>
        <button onclick="stepBpm(5)">+5</button>
      </div>
      <button id="playBtn" class="play-btn" onclick="toggleMetro()">▶ START</button>
    </div>
  </div>

  <!-- 인덱스 모달 -->
  <div class="modal" id="indexModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div style="font-size:15px; font-weight:800; color:#c084fc;">🔍 주제 및 곡 바로가기</div>
        <button onclick="closeIndexModal()" style="background:none; border:none; color:#94a3b8; font-size:16px; cursor:pointer;">✕</button>
      </div>
      <select id="tuneJumpSelect" onchange="jumpToSelectedTune(this.value)" style="width:100%; background:#0b0d12; border:1px solid #3b82f6; color:#fde047; padding:9px; border-radius:6px; font-weight:bold; margin-bottom:12px;"></select>
      <div style="display:flex; gap:6px;">
        <input type="number" id="directDayInput" min="1" max="1095" placeholder="Day 직접 입력 (1~1095)" style="flex:1; background:#0b0d12; border:1px solid #282d37; color:#fff; padding:8px; border-radius:6px; font-size:13px;">
        <button onclick="jumpDirectDay()" style="background:#3b82f6; border:none; color:#fff; font-weight:bold; padding:8px 16px; border-radius:6px; cursor:pointer;">이동</button>
      </div>
    </div>
  </div>

  <!-- 완료 축하 모달 -->
  <div class="modal" id="praiseModal">
    <div class="modal-box" style="text-align:center;">
      <div style="font-size:26px;">🎸</div>
      <h3 style="margin-top:6px; font-size:17px;">오늘의 세션 완료!</h3>
      <p id="praiseQuote" style="margin:14px 0; font-size:14px; color:#fde047; font-weight:600; line-height:1.5;"></p>
      <button onclick="closeModal()" style="background:#22c55e; color:#000; font-weight:800; border:none; padding:8px 24px; border-radius:6px; cursor:pointer;">확인</button>
    </div>
  </div>

  <script>
    var PLAYLIST_URL = "https://youtube.com/playlist?list=PLUhKlj-gxAgo9UYVF1jAqp22rVRnKvqE_";
    var JOIN_URL = "https://www.youtube.com/channel/UCI8PtsibK2wGkrvaKUdW0kg/join";

    var keys = ["C", "F", "Bb", "Eb", "Ab", "Db", "Gb", "B", "E", "A", "D", "G"];
    var fallbackPatterns = [
      "2도 스텝와이즈", "3도 인터벌", "4도 인터벌", "5도 인터벌",
      "6도 인터벌", "7도 인터벌", "옥타브 도약", "다이아토닉 3화음",
      "다이아토닉 7th", "3연음 그룹핑", "4연음 그룹핑"
    ];

    var standardTunes = [
      "Autumn Leaves", "Blue Bossa", "Fly Me to the Moon", "All of Me",
      "Black Orpheus", "Take the A Train", "Now's the Time", "There Will Never Be Another You",
      "Satin Doll", "Doxy", "Someday My Prince Come", "Blue Monk",
      "All the Things You Are", "Beautiful Love", "Alone Together", "Days of Wine and Roses",
      "Night and Day", "Stella by Starlight", "Oleo", "Body and Soul",
      "Have You Met Miss Jones", "Softly, as in a Morning Sunrise", "My Romance", "Wave",
      "Just Friends", "Cherokee", "I'll Remember April", "In a Mellow Tone",
      "Four", "Yardbird Suite", "Corcovado", "The Girl from Ipanema",
      "Out of Nowhere", "Billie's Bounce", "What Is This Thing Called Love", "Solar",
      "Recorda Me", "How Deep Is the Ocean",
      "Giant Steps", "Donna Lee", "Round Midnight", "Confirmation",
      "Joy Spring", "Inner Urge", "Stablemates", "Con Alma",
      "Footprints", "Like Someone in Love", "Blues for Alice", "Up Jumped Spring",
      "Nardis", "Very Early", "Moment's Notice", "Lazy Bird",
      "Along Came Betty", "Dolphin Dance", "Maiden Voyage", "Invitation",
      "Central Park West", "26-2", "Impressions", "Airegin",
      "Spain", "Anthropology"
    ];

    function safeSave(k, v) { try { localStorage.setItem(k, String(v)); } catch(e) {} }
    function safeGet(k, def) {
      try {
        var v = localStorage.getItem(k);
        if (v !== null && v !== 'undefined' && v !== '') return v;
      } catch(e) {}
      return def;
    }

    var currentLang = safeGet('jazz_lang', 'ko');
    var rawDay = parseInt(safeGet('jazz_day', '1'), 10);
    var currentDay = (!isNaN(rawDay) && rawDay >= 1 && rawDay <= 1095) ? rawDay : 1;
    var activeStepIdx = 0; // 현재 열려있는 아코디언 인덱스

    function getTuneStartDay(i) {
      if (i < 12) return (i * 30) + 1;
      return 361 + ((i - 12) * 14);
    }

    function getTodayRhythm(d) {
      var isEn = (currentLang === 'en');
      var r4 = isEn ? "Quarter" : "4분음표";
      var r8 = isEn ? "8th" : "8분음표";
      var r16 = isEn ? "16th" : "16분음표";
      var r3trip = isEn ? "Triplets" : "3잇단";
      var r6trip = isEn ? "Sextuplets" : "6잇단";
      var r32 = isEn ? "32nd/Sync" : "32분/변형";

      if (d <= 14) {
        var pool1 = [r4, r8, r16];
        return pool1[(d - 1) % pool1.length];
      }
      if (d <= 28) {
        var pool2 = [r4, r8, r16, r3trip, r6trip];
        return pool2[(d - 1) % pool2.length];
      }
      var pool3 = [r4, r8, r16, r3trip, r6trip, r32];
      return pool3[(d - 1) % pool3.length];
    }

    function getCompletedMap() {
      try { return JSON.parse(safeGet('jazz_completed_map', '{}')) || {}; } catch(e) { return {}; }
    }

    function toggleStep(idx) {
      activeStepIdx = (activeStepIdx === idx) ? -1 : idx;
      render(currentDay);
    }

    function toggleLang() {
      currentLang = (currentLang === 'ko') ? 'en' : 'ko';
      safeSave('jazz_lang', currentLang);
      document.getElementById('langToggleBtn').innerText = (currentLang === 'ko') ? 'EN' : 'KO';
      populateTuneSelect();
      render(currentDay);
    }

    function openIndexModal() { populateTuneSelect(); document.getElementById('indexModal').style.display = 'flex'; }
    function closeIndexModal() { document.getElementById('indexModal').style.display = 'none'; }
    function closeModal() { document.getElementById('praiseModal').style.display = 'none'; }

    function jumpToDay(targetDay) {
      currentDay = Math.max(1, Math.min(1095, targetDay));
      safeSave('jazz_day', currentDay);
      closeIndexModal();
      render(currentDay);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpDirectDay() {
      var val = parseInt(document.getElementById('directDayInput').value, 10);
      if (!isNaN(val) && val >= 1 && val <= 1095) jumpToDay(val);
    }

    function jumpToSelectedTune(startDay) { if (startDay) jumpToDay(parseInt(startDay, 10)); }

    function populateTuneSelect() {
      var select = document.getElementById('tuneJumpSelect');
      if (!select) return;
      var curTuneIdx = currentDay <= 360 ? Math.floor((currentDay - 1) / 30) : 12 + Math.floor((currentDay - 361) / 14);
      if (curTuneIdx >= standardTunes.length) curTuneIdx = standardTunes.length - 1;

      var html = '<option value="">' + (currentLang === 'en' ? '▼ Select Tune Shortcut...' : '▼ 곡 바로가기 선택...') + '</option>';
      for (var i = 0; i < standardTunes.length; i++) {
        var startDay = getTuneStartDay(i);
        var isCurrent = (i === curTuneIdx) ? ' (현재 학습 중)' : '';
        html += '<option value="' + startDay + '">#' + (i + 1) + ' ' + standardTunes[i] + ' [D-' + startDay + ']' + isCurrent + '</option>';
      }
      select.innerHTML = html;
    }

    function saveMemo() { safeSave('jazz_memo_' + currentDay, document.getElementById('memoBox').value); }

    function toggleComplete() {
      var map = getCompletedMap();
      if (map[currentDay]) {
        delete map[currentDay];
        safeSave('jazz_completed_map', JSON.stringify(map));
      } else {
        map[currentDay] = true;
        safeSave('jazz_completed_map', JSON.stringify(map));
        document.getElementById('praiseQuote').innerText = '"루틴을 묵묵히 통과한 연주자만이 무대 위에서 완전한 자유를 누립니다."';
        document.getElementById('praiseModal').style.display = 'flex';
      }
      render(currentDay);
    }

    function moveDay(step) {
      currentDay = Math.max(1, Math.min(1095, currentDay + step));
      safeSave('jazz_day', currentDay);
      render(currentDay);
    }

    function render(d) {
      document.getElementById('dayTitle').innerText = 'DAY ' + d;
      document.getElementById('memoBox').value = safeGet('jazz_memo_' + d, '');

      var map = getCompletedMap();
      var btn = document.getElementById('completeBtn');
      if (map[d]) {
        btn.innerText = '✓ Day ' + d + ' 완주 완료됨 (취소하려면 클릭)';
        btn.classList.add('completed');
      } else {
        btn.innerText = '오늘 3시간 완주 체크 완료';
        btn.classList.remove('completed');
      }

      // 일요일(7의 배수) 자율 세션
      if (d % 7 === 0) {
        document.getElementById('summaryKeyText').innerText = "REST & JAM";
        document.getElementById('summaryRhythmText').innerText = "자율 세션";
        document.getElementById('routineAccordion').innerHTML = 
          '<div class="routine-step-card active">' +
            '<div class="step-header"><div class="step-title-wrap"><span class="step-num">☕</span><span class="step-name">FREE JAM & REVIEW</span></div></div>' +
            '<div class="step-body" style="display:block;">' +
              '<div class="task-item"><input type="checkbox"><div>손과 어깨 스트레칭 & 크로매틱 (15m)</div></div>' +
              '<div class="task-item"><input type="checkbox"><div>이번 주 6개 키 중 뻑뻑했던 포지션 복습</div></div>' +
              '<div class="task-item"><input type="checkbox"><div>백킹트랙 위에서 자유 즉흥연주 (Free Jam)</div></div>' +
              '<a href="' + JOIN_URL + '" target="_blank" rel="noopener" class="video-hint-link">💬 [일 10pm] 라이브 Q&A 참여하기 →</a>' +
            '</div>' +
          '</div>';
        return;
      }

      var activeIdx = (d - Math.floor(d / 7) - 1);
      var curKey = keys[activeIdx % 12];
      var rhythm = getTodayRhythm(d);
      var yr = d <= 365 ? 1 : (d <= 730 ? 2 : 3);
      var posTxt = yr === 1 ? ("CAGED Pos " + (((d - 1) % 5) + 1)) : ("Pos " + (((d - 1) % 7) + 1));
      
      var pattern = fallbackPatterns[(d - 1) % fallbackPatterns.length];

      var tuneIdx = d <= 360 ? Math.floor((d - 1) / 30) : 12 + Math.floor((d - 361) / 14);
      if (tuneIdx >= standardTunes.length) tuneIdx = standardTunes.length - 1;
      var curTune = standardTunes[tuneIdx];

      document.getElementById('summaryKeyText').innerText = curKey + " Key (Yr " + yr + ")";
      document.getElementById('summaryRhythmText').innerText = rhythm;

      // 4단계 요약 데이터
      var steps = [
        {
          name: "DAILY CORE", time: "45m",
          tasks: [
            "손과 어깨 릴랙스 스트레칭 (5m)",
            "크로매틱 핑거링 독립성 (10m)",
            curKey + " 스케일 [" + posTxt + "] (20m) └ " + rhythm,
            d > 90 ? "스윙 컴핑 & 4비트 워킹베이스 (10m)" : "2&4박 피킹 정밀도 훈련 (10m)"
          ]
        },
        {
          name: "HARMONY & VOICE LEADING", time: "45m",
          tasks: [
            d < 56 ? curKey + " 다이아토닉 3화음 & 135 아르페지오" :
            (yr === 1 ? curKey + " 2-5-1 가이드톤 보이스리딩 (Drop 2 / Shell)" :
            (yr === 2 ? curKey + " 6-2-5-1 사이클 보이스리딩" : curKey + " 8마디 복합 하모니"))
          ]
        },
        {
          name: "CHORD-MELODY (" + curTune + ")", time: "45m",
          tasks: [
            d <= 60 ? "[" + curTune + "] (" + curKey + ") 멜로디 단음 연주" :
            (yr === 1 ? "[" + curTune + "] (" + curKey + ") 멜로디 + 1-3-7 컴핑 & 워킹" :
            "[" + curTune + "] (" + curKey + ") 2성부 보이싱 & 템포 푸시")
          ]
        },
        {
          name: "JAZZ LANGUAGE & PATTERNS", time: "45m",
          tasks: [
            d <= 90 ? curKey + " 패턴 드릴 └ " + pattern + " (" + rhythm + ")" :
            "★ 오늘의 마스터 셀 트레이닝"
          ]
        }
      ];

      var html = '';
      for (var i = 0; i < steps.length; i++) {
        var isOpen = (i === activeStepIdx) ? 'active' : '';
        html += 
          '<div class="routine-step-card ' + isOpen + '">' +
            '<div class="step-header" onclick="toggleStep(' + i + ')">' +
              '<div class="step-title-wrap">' +
                '<span class="step-num">' + (i + 1) + '</span>' +
                '<span class="step-name">' + steps[i].name + '</span>' +
              '</div>' +
              '<div style="display:flex; align-items:center;">' +
                '<span class="step-time">' + steps[i].time + '</span>' +
                '<span class="toggle-icon">▼</span>' +
              '</div>' +
            '</div>' +
            '<div class="step-body">';
        
        for (var j = 0; j < steps[i].tasks.length; j++) {
          html += '<div class="task-item"><input type="checkbox"><div>' + steps[i].tasks[j] + '</div></div>';
        }

        html += '<a href="' + PLAYLIST_URL + '" target="_blank" rel="noopener" class="video-hint-link">▶ 프로반 48강 해설 영상 보기</a>';
        html += '</div></div>';
      }

      document.getElementById('routineAccordion').innerHTML = html;
    }

    /* 메트로놈 로직 */
    var actx = null, ticking = false, bpm = 85, nextTick = 0.0, timerId = null;
    function stepBpm(diff) {
      bpm = Math.max(30, Math.min(400, bpm + diff));
      document.getElementById('bpmTxt').innerText = bpm;
    }
    function playBeep(t) {
      var osc = actx.createOscillator();
      var gain = actx.createGain();
      osc.frequency.setValueAtTime(1050, t);
      gain.gain.setValueAtTime(1, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.025);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start(t);
      osc.stop(t + 0.025);
    }
    function loopMetro() {
      while (nextTick < actx.currentTime + 0.1) {
        playBeep(nextTick);
        nextTick += 60.0 / bpm;
      }
      if (ticking) timerId = setTimeout(loopMetro, 25);
    }
    function toggleMetro() {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        actx = new AC();
      }
      if (actx.state === 'suspended') actx.resume();
      ticking = !ticking;
      var btn = document.getElementById('playBtn');
      if (ticking) {
        btn.innerText = '■ STOP';
        btn.classList.add('on');
        nextTick = actx.currentTime + 0.05;
        loopMetro();
      } else {
        btn.innerText = '▶ START';
        btn.classList.remove('on');
        clearTimeout(timerId);
      }
    }

    populateTuneSelect();
    render(currentDay);
  </script>
</body>
</html>
